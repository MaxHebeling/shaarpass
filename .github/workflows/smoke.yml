name: Smoke (prod health)

# Verifica que producción responde sano: tras cada deploy a main, cada 30 min, y a demanda.
# No requiere credenciales: solo golpea endpoints públicos de salud.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health (liveness)
        run: |
          echo "→ /api/health"
          body=$(curl -fsS --max-time 20 https://www.shaarpass.io/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::health no ok"; exit 1; }

      - name: Ready (readiness: DB + config)
        run: |
          echo "→ /api/ready"
          code=$(curl -s -o /tmp/ready.json -w "%{http_code}" --max-time 20 https://www.shaarpass.io/api/ready)
          cat /tmp/ready.json; echo
          if [ "$code" != "200" ]; then echo "::error::ready devolvió $code"; exit 1; fi
          grep -q '"database":"ok"' /tmp/ready.json || { echo "::error::database no ok"; exit 1; }
